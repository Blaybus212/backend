app:
  cors:
    # 환경 변수로 주입
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop # 개발 완료후 변경

logging:
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      # 전략: 날짜별(일 단위)로 나누되, 파일 하나가 10MB를 넘으면 분할(Indexing)하여 저장
      # 보관 위치: logs/archived/ 폴더에 날짜별로 정리되어 깔끔하게 관리됨
      file-name-pattern: logs/archived/backend-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30 # 30일이 지난 로그는 자동 삭제
