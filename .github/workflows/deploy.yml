name: Deploy to GCP VM

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트 실패시 도커 빌드 이전에 빠르게 실패
      - name: Test with Gradle
        run: ./gradlew test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          # 버전 관리를 위해 latest와 커밋 해시(sha) 태그 동시 사용
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blaybus-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/blaybus-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/"

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          # docker-compose 실행 시 필요한 DB 자격 증명 전달
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DB_USERNAME,DB_PASSWORD,POSTGRES_DB
          script: |
            # 1. 환경 변수 업데이트 및 확인
            # (민감한 변수는 envs로 전달되지만, docker-compose가 인식할 수 있도록 
            #  현재 쉘 세션에 export 하거나 .env 파일에 기록해야 함)
            # 영구 저장이 필요하면 .env 파일 사용이 안전하지만, 
            # 'docker-compose up' 실행에는 현재 세션 export로 충분함

            export SPRING_PROFILES_ACTIVE=prod
            export DB_USERNAME=$DB_USERNAME
            export DB_PASSWORD=$DB_PASSWORD
            export POSTGRES_DB=$POSTGRES_DB

            # 2. 최신 도커 이미지 다운로드(pull)
            echo "Pulling latest image..."
            sudo docker pull $DOCKER_USERNAME/blaybus-backend:latest

            # 3. 서비스 재시작
            # (이전 단계에서 docker-compose.yml이 ~/ 경로로 자동 복사됨)
            echo "Restarting services..."

            sudo docker-compose -f ~/docker-compose.yml down
            sudo docker-compose -f ~/docker-compose.yml pull web-server
            sudo docker-compose -f ~/docker-compose.yml up -d --force-recreate

            # 4. 정리 (미사용 이미지 삭제)
            sudo docker image prune -f
