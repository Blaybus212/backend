name: Deploy to GCP VM

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트 실패시 도커 빌드 이전에 빠르게 실패
      # CI 환경에서는 테스트용 환경 변수만 설정
      - name: Test with Gradle
        run: ./gradlew test --no-daemon
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-onlytest-secret-key-for-ci-only

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          # 버전 관리를 위해 latest와 커밋 해시(sha) 태그 동시 사용
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blaybus-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/blaybus-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy infra configuration files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,prometheus.yml,grafana/,.env.gpg"
          target: "~/"

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,GPG_PASSPHRASE
          script: |
            # 0. 에러 발생 시 즉시 중단
            set -e

            # 1. .env 파일 복호화
            echo "Decrypting .env file..."
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --decrypt --output .env .env.gpg

            # 보안: 복호화된 .env 파일 권한 설정
            chmod 600 .env

            # 2. 최신 도커 이미지 다운로드(pull)
            echo "Pulling latest image..."
            sudo docker pull $DOCKER_USERNAME/blaybus-backend:latest

            # 3. 서비스 재시작
            echo "Restarting services..."

            # docker compose v2 사용
            # .env 파일은 현재 디렉토리(~/)에 생성되었으므로 자동 인식됨
            sudo docker compose -f ~/docker-compose.yml down
            sudo docker compose -f ~/docker-compose.yml pull
            sudo docker compose -f ~/docker-compose.yml up -d --force-recreate

            # 4. 정리 (미사용 이미지 삭제)
            sudo docker image prune -f
