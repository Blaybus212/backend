name: Deploy to GCP VM

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트 실패시 도커 빌드 이전에 빠르게 실패
      - name: Test with Gradle
        run: ./gradlew test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          # 버전 관리를 위해 latest와 커밋 해시(sha) 태그 동시 사용
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blaybus-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/blaybus-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Copy infra configuration files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,prometheus.yml,grafana/"
          target: "~/"

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          # docker-compose 실행 시 필요한 DB 정보 전달
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DB_USERNAME,DB_PASSWORD,POSTGRES_DB
          script: |
            # 0. 에러 발생 시 즉시 중단
            set -e

            # 1. 환경 변수 설정 (.env 파일 생성)
            # sudo 실행 시 환경 변수가 유지되지 않을 수 있으므로 .env 파일로 주입
            echo "Creating .env file..."
            echo "SPRING_PROFILES_ACTIVE=prod" > .env
            echo "DB_USERNAME=$DB_USERNAME" >> .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "POSTGRES_DB=$POSTGRES_DB" >> .env
            echo "DOCKER_USERNAME=$DOCKER_USERNAME" >> .env

            # 2. 최신 도커 이미지 다운로드(pull)
            echo "Pulling latest image..."
            sudo docker pull $DOCKER_USERNAME/blaybus-backend:latest

            # 3. 서비스 재시작
            echo "Restarting services..."

            # docker compose v2 사용
            # .env 파일은 현재 디렉토리(~/)에 생성되었으므로 자동 인식됨
            sudo docker compose -f ~/docker-compose.yml down
            sudo docker compose -f ~/docker-compose.yml pull
            sudo docker compose -f ~/docker-compose.yml up -d --force-recreate

            # 4. 정리 (미사용 이미지 삭제)
            sudo docker image prune -f
